langcode: en
status: true
dependencies:
  config:
    - node.type.location
    - node.type.opportunity
    - node.type.story
  module:
    - content_moderation
id: editorial
label: Editorial
type: content_moderation
type_settings:
  states:
    archived:
      label: Archived
      weight: 5
      published: false
      default_revision: true
    draft:
      label: Draft
      weight: -5
      published: false
      default_revision: false
    needs_review:
      label: 'Needs review'
      weight: -4
    published:
      label: Published
      weight: 0
      published: true
      default_revision: true
  transitions:
    archive:
      label: Archive
      from:
        - published
      to: archived
      weight: 2
    archived_draft:
      label: 'Restore to Draft'
      from:
        - archived
      to: draft
      weight: 3
    archived_published:
      label: Restore
      from:
        - archived
      to: published
      weight: 4
    create_new_draft:
      label: 'Create New Draft'
      from:
        - draft
        - needs_review
        - published
      to: draft
      weight: 0
    publish:
      label: Publish
      from:
        - draft
        - needs_review
        - published
      to: published
      weight: 1
    submit_for_review:
      label: 'Submit for review'
      from:
        - draft
      to: needs_review
      weight: 5
  entity_types:
    node:
      - location
      - opportunity
      - story
  default_moderation_state: draft
